name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            triple: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.triple }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Prepare ffmpeg sidecar
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp node_modules/ffmpeg-static/ffmpeg.exe "src-tauri/binaries/ffmpeg-${{ matrix.triple }}.exe"
          else
            cp node_modules/ffmpeg-static/ffmpeg "src-tauri/binaries/ffmpeg-${{ matrix.triple }}"
          fi
      - run: npx tauri build ${{ matrix.args }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoUnify-${{ matrix.triple }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
